[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#2a2f3a\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><style>html,body{margin:0;height:100%;background:#2a2f3a;overflow:hidden;touch-action:none}#canvas{position:fixed!important;top:0;left:50%!important;transform:translateX(-50%);height:100vh!important;height:100dvh!important;width:min(100vw,calc(100dvh*9/16))!important;border-radius:0;box-shadow:0 0 40px rgba(0,0,0,.45)}@media (min-aspect-ratio: 10/16){#canvas{border-radius:18px;height:calc(100dvh - 24px)!important;top:12px;width:calc((100dvh - 24px)*9/16)!important}}</style><script>(function(){function fit(){var c=document.getElementById(\"canvas\");if(!c)return;var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;var w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}}window.addEventListener(\"resize\",fit);document.addEventListener(\"DOMContentLoaded\",function(){fit();setInterval(fit,500);});})();</script>"
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=2
